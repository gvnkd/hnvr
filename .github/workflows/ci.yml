name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: nix flake check
        run: nix --accept-flake-config flake check --no-build
      - name: nix build .#hnvr-web
        run: nix --accept-flake-config build --no-link .#hnvr-web
      - name: nix build .#hnvr-nats
        run: nix --accept-flake-config build --no-link .#hnvr-nats

  # Build the 6 non-IHP packages via cabal inside `nix develop` for fast
  # feedback on cabal-side regressions (nix build covers the IHP path).
  # hnvr-web is excluded — IHP's transitive version pins (mime-mail-ses →
  # memory/crypton skew) only exist in the nix overlay, not in Hackage.
  cabal-non-web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.12.3"]
        # To re-enable the GHC 9.10 sanity build (per design_docs/08-roadmap.md
        # "matrix GHC 9.10 sanity + 9.12 target"), uncomment:
        #   - "9.10.1"
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: cabal build (non-web packages)
        run: |
          nix develop --command \
            bash -c 'cabal update && cabal build hnvr-core hnvr-nats hnvr-storage hnvr-capture hnvr-cv hnvr-ptz'

  # S1 deliverable (design_docs/10-test-plan.md): cabal test runs the pure
  # + property test suites on every push. hnvr-web is excluded (its tests
  # live in the next sprint and need IHP's nix-built libs).
  cabal-test-non-web:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        ghc: ["9.12.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: cabal test (non-web packages)
        run: |
          nix develop --command \
            bash -c 'cabal update && cabal test hnvr-core hnvr-nats hnvr-storage hnvr-capture hnvr-cv'
        # Integration tests in hnvr-nats/hnvr-storage are gated on
        # HNVR_TEST_INTEGRATION=1 and silently skip without it. The
        # hnvr-cv OnnxRuntime smoke tests are gated on
        # HNVR_ONNXRUNTIME_LIB and skip without it. The
        # nightly devenv-integration job (design_docs/09-testing.md)
        # will exercise them against live services.

  # S4 deliverable (design_docs/10-test-plan.md): Playwright E2E against
  # a fully-booted leader + devenv services. Runs nightly + on master so
  # PRs aren't blocked by a flaky environment. Single-worker to match
  # the playwright.config.ts setting (shared dev DB).
  playwright-e2e:
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.ref == 'refs/heads/master'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true

      - name: Build leader binary
        run: nix build .#hnvr-web --no-link

      - name: Boot devenv services (postgres, nats, minio, mediamtx)
        run: |
          nix develop --command bash -c 'devenv up --detach'

      - name: Start leader in background
        run: |
          nix develop --command bash -c \
            './result/bin/hnvr-leader > leader.log 2>&1 &'
          # Wait for /healthz
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:18001/healthz; then break; fi
            sleep 1
          done

      - name: Install Playwright + Chromium
        working-directory: tests/e2e
        run: |
          nix develop --command bash -c 'npm install && npx playwright install chromium'

      - name: Run Playwright suite
        working-directory: tests/e2e
        run: nix develop --command bash -c 'npm test'

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/results.xml
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: tests/e2e/test-results/
          if-no-files-found: ignore

      - name: Upload leader log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: leader-log
          path: leader.log
          if-no-files-found: ignore
