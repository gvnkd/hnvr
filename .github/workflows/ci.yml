name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: nix flake check
        run: nix --accept-flake-config flake check --no-build
      - name: nix build .#hnvr-web
        run: nix --accept-flake-config build --no-link .#hnvr-web

  cabal-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: cabal build all (inside nix develop)
        run: nix --accept-flake-config develop -c cabal build all
