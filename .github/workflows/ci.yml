name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  nix-flake-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            accept-flake-config = true
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v15
        with:
          name: digitallyinduced
          skipPush: true
      - name: nix flake check
        run: nix --accept-flake-config flake check --no-build
      - name: nix build .#hnvr-web
        run: nix --accept-flake-config build --no-link .#hnvr-web
      - name: nix build .#hnvr-nats
        run: nix --accept-flake-config build --no-link .#hnvr-nats

  # NOTE: We do NOT run `cabal build all` in CI. IHP's transitive deps
  # need version pins that IHP's nix overlay applies but cabal doesn't
  # see; `cabal build` of hnvr-web fails on mime-mail-ses (memory/crypton
  # version skew). `nix build` is canonical. cabal is supported for the
  # non-IHP packages (hnvr-core, hnvr-nats, hnvr-storage, hnvr-capture,
  # hnvr-cv, hnvr-ptz) inside `nix develop` for fast iteration.
