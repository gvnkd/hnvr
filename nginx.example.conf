# nginx.example.conf — reverse proxy in front of HNVR nodes.
#
# Topology (per design_docs/07-deployment.md):
#
#   browser ──TLS──> nginx ──> hnvr-leader  (IHP web, prod :8000 / dev :18001)
#                    nginx ──> hnvr-admin   (management UI, :18010, mgmt net only)
#   browser ──UDP 8189──> mediamtx          (WebRTC ICE/DTLS — NOT proxied)
#
# /whep/<slug> is proxied to the LEADER, not to mediamtx directly: the app's
# authz middleware enforces per-camera ACL there and then forwards to
# mediamtx :8889 itself. Bypassing the leader skips the ACL.
#
# Never expose: metrics (:9100 prod / :9102 dev, Prometheus, scrape locally),
# mediamtx API (:9997, loopback), NATS (:4222). RTSP :8554 is not HTTP — see
# the optional stream{} block at the bottom.
#
# Merge the http{} blocks into your existing nginx.conf; the file is
# self-contained so it can also run standalone for testing:
#   nginx -c $PWD/nginx.example.conf -g 'daemon off;'

events {
  worker_connections 4096;
}

http {
  # WebSocket upgrade header mapping (IHP liveview/auto-refresh).
  map $http_upgrade $hnvr_connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream hnvr_leader {
    server 127.0.0.1:8000;    # dev leader: 127.0.0.1:18001
    keepalive 32;
  }

  upstream hnvr_admin {
    server 127.0.0.1:18010;
    keepalive 8;
  }

  # --- Public viewer UI -------------------------------------------------
  server {
    listen 80;
    server_name nvr.example.com;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name nvr.example.com;

    ssl_certificate     /etc/nginx/tls/nvr.example.com.crt;   # placeholder
    ssl_certificate_key /etc/nginx/tls/nvr.example.com.key;   # placeholder

    # Timeline window playlists chain 10-minute fMP4 segments; the
    # /PlaylistArchive presign pass can take ~8 s. Keep read timeouts
    # comfortably above that.
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;

    location / {
      proxy_pass http://hnvr_leader;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $hnvr_connection_upgrade;
    }

    # WHEP live-view signalling. Routed via the leader (ACL enforced in
    # authz middleware) — do NOT point this at mediamtx :8889 directly
    # unless you intentionally want unauthenticated live view.
    location /whep/ {
      proxy_pass http://hnvr_leader;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_request_buffering off;
    }

    location = /healthz {
      proxy_pass http://hnvr_leader;
      access_log off;
    }

    # --- Optional: leader under a sub-path (e.g. /hnvr/) ---------------
    # Requires hnvr-leader started with its public URL INCLUDING the
    # path:  HNVR_BASE_URL=https://nvr.example.com/hnvr
    # The app strips the prefix itself and serves <prefix>/static/*;
    # /healthz, /status, /debug-frame and /whep all move under the
    # prefix (outside-prefix requests 404). Replace the location / and
    # /whep/ blocks above with:
    #
    # location = /hnvr { return 301 /hnvr/; }
    # location /hnvr/ {
    #   proxy_pass http://hnvr_leader;      # NO URI part — app strips
    #   proxy_http_version 1.1;
    #   proxy_set_header Host              $host;
    #   proxy_set_header X-Real-IP         $remote_addr;
    #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header Upgrade           $http_upgrade;
    #   proxy_set_header Connection        $hnvr_connection_upgrade;
    # }
    # location /hnvr/whep/ {                # same ACL path, buffering off
    #   proxy_pass http://hnvr_leader;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host              $host;
    #   proxy_set_header X-Real-IP         $remote_addr;
    #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_buffering off;
    #   proxy_request_buffering off;
    # }
  }

    # --- Optional: hnvr-admin under a sub-path of THIS vhost -------------
    # Alternative to the dedicated admin vhost below. Requires hnvr-admin
    # started with its public URL INCLUDING the path:
    #
    #   HNVR_ADMIN_BASE_URL=https://nvr.example.com/admin
    #
    # The app strips the /admin prefix itself (AdminWeb.BasePath) and
    # prefixes every generated URL/redirect with it — proxy_pass WITHOUT
    # a URI part (no trailing slash, no rewrite) so the original
    # /admin/... path reaches the app untouched.
    #
    # location = /admin { return 301 /admin/; }
    # location /admin/ {
    #   proxy_pass http://hnvr_admin;
    #   proxy_http_version 1.1;
    #   proxy_set_header Host              $host;
    #   proxy_set_header X-Real-IP         $remote_addr;
    #   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #   proxy_set_header X-Forwarded-Proto $scheme;
    #   proxy_set_header Upgrade           $http_upgrade;
    #   proxy_set_header Connection        $hnvr_connection_upgrade;
    # }
  }

  # --- Management UI (hnvr-admin) ---------------------------------------
  # hnvr-admin owns ALL mutation (cameras, rules, roles). Bind the vhost on
  # a management interface and/or restrict by source IP. Better: leave
  # hnvr-admin on loopback and reach it via SSH forwarding instead.
  server {
    listen 10.9.0.5:8443 ssl;               # placeholder mgmt address
    server_name nvr-admin.example.com;

    ssl_certificate     /etc/nginx/tls/nvr.example.com.crt;   # placeholder
    ssl_certificate_key /etc/nginx/tls/nvr.example.com.key;   # placeholder

    allow 10.9.0.0/24;                       # placeholder mgmt CIDR
    deny all;

    location / {
      proxy_pass http://hnvr_admin;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $hnvr_connection_upgrade;
    }
  }
}

# --- Optional: RTSP passthrough ------------------------------------------
# RTSP is a TCP protocol, not HTTP — it needs the stream module
# (nginx -V | grep with-stream). Usually you do NOT want this: cameras and
# CaptureWorker already converge on mediamtx as the single ingestion point.
# Only uncomment if remote clients must pull RTSP through this host.
#
# stream {
#   upstream hnvr_rtsp { server 127.0.0.1:8554; }
#   server {
#     listen 8555;
#     proxy_pass hnvr_rtsp;
#   }
# }
