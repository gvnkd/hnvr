# HNVR secrets via sops-nix.
#
# This is a TEMPLATE for Sergey to fill in with real production values.
# The schema below is what the rest of the NixOS modules expect; the
# sops-nix machinery decrypts the values at activation time and exposes
# them as systemd environment variables.
#
# To use:
#   1. Generate a per-host age/PGP key per sops-nix docs
#   2. Create a real secrets.yaml with the encrypted values below
#   3. Reference it from the host's NixOS config:
#        sops.defaultSopsFile = ./secrets/leader.yaml;
#        sops.secrets.hnvr-data-key.owner = "hnvr";
#        sops.secrets.hnvr-s3-access-key.owner = "hnvr";
#        sops.secrets.hnvr-s3-secret-key.owner = "hnvr";
#        sops.secrets.hnvr-db-url.owner = "hnvr";
#   4. The hnvr-leader systemd service then reads the env vars below
#      (systemd EnvironmentFile points to sops-nix's decrypted path).
#
# For local dev (no sops), just export the env vars manually:
#   export HNVR_DATA_KEY=$(openssl rand -base64 32)
#   export HNVR_S3_ENDPOINT=http://localhost:9000
#   export HNVR_S3_ACCESS_KEY=minioadmin
#   export HNVR_S3_SECRET_KEY=minioadmin
#   export HNVR_S3_BUCKET=hnvr-recordings
#   export HNVR_DB_URL=postgresql:///hnvr
#
# Each value below is a placeholder for the YAML keys sops-nix expects.

hnvr-data-key: ENC[AES256_GCM,data:PHOLDER-base64-32-bytes,iv:PLACEHOLDER]

hnvr-s3-endpoint: ENC[AES256_GCM,data:https://s3.example.com,iv:PLACEHOLDER]
hnvr-s3-access-key: ENC[AES256_GCM,data:ACCESS_KEY_HERE,iv:PLACEHOLDER]
hnvr-s3-secret-key: ENC[AES256_GCM,data:SECRET_KEY_HERE,iv:PLACEHOLDER]
hnvr-s3-bucket: hnvr-recordings

hnvr-db-url: ENC[AES256_GCM,data:postgresql://user:pass@host/dbname,iv:PLACEHOLDER]
