# HNVR secrets via sops-nix — TEMPLATE.
#
# Copy to secrets/<host>.yaml, fill in real values, then encrypt:
#   sops --encrypt --in-place secrets/<host>.yaml
#
# The encrypted file is what services.hnvr.secrets.sopsFile points at
# in your host NixOS config. Each top-level key becomes a /run/secrets/<key>
# file at activation; nix/module.nix's preStart generates systemd
# EnvironmentFile fragments from those.
#
# To generate the host's age key + register its public key in .sops.yaml:
#   nix shell nixpkgs#age -c age-keygen -o /var/lib/sops-nix/key.txt
#   # copy the "age1..." public key line, add it to .sops.yaml's creation_rules
#
# To rotate any value (e.g. INITIAL_ADMIN_PASSWORD after first boot):
#   sops secrets/<host>.yaml   # opens $EDITOR with decrypted values
#   # edit, save, quit — sops re-encrypts in place
#   nixos-rebuild switch --flake .#<host>
#   systemctl restart hnvr-leader
#
# Required keys (leader host):
hnvr-data-key: ENC[AES256_GCM,data:BASE64_32_BYTE_AES_KEY,iv:PLACEHOLDER]

# App config file (S3 credentials etc.) — the whole hnvr.yaml, stored as
# ONE sops secret. Point services.hnvr.leader.configFile at
# config.sops.secrets.hnvr-config.path and set that secret's owner to
# the hnvr user (the service reads the file at runtime; it is NOT loaded
# via systemd EnvironmentFile). Plaintext shape (see hnvr.example.yaml):
#
#   s3:
#     endpoint: "http://192.168.0.254:8333"
#     public_endpoint: "http://192.168.0.254:8333"
#     bucket: "hnvr"
#     access_key: "SERVER_SIDE_KEY"        # Admin/Read/Write/List/Tagging
#     secret_key: "SERVER_SIDE_SECRET"
#     ro_access_key: "BROWSER_RO_KEY"      # Read/List only; signs presigned URLs
#     ro_secret_key: "BROWSER_RO_SECRET"
#
hnvr-config: ENC[AES256_GCM,data:FULL_HNVR_YAML_HERE,iv:PLACEHOLDER]

# PostgreSQL SaaS connection string.
hnvr-db-url: ENC[AES256_GCM,data:postgresql://user:pass@host/dbname,iv:PLACEHOLDER]

# Bootstrap admin user (only used at leader boot to INSERT the first
# admin row; rotate the password via the UI after first login).
initial-admin-email: ENC[AES256_GCM,data:admin@example.com,iv:PLACEHOLDER]
initial-admin-password: ENC[AES256_GCM,data:CHANGE_ME_IMMEDIATELY,iv:PLACEHOLDER]
