# HLint hints configuration. hlint is run via the pre-commit-hooks.nix
# hook; without this file it fails on stylistic suggestions (redundant
# parens around constraints, etc.) that ormolu 0.8.x produces. We keep
# the hook on for catching real bugs (unused imports, etc.) but ignore
# the suggestions below.

# Ignore all "suggestions" (severity lower than warning). hlint's hint
# taxonomy: error > warning > suggestion. We want errors + warnings.
- ignore: {name: "Use newtype instead of data"}
- ignore: {name: "Redundant bracket"}
- ignore: {name: "Redundant id"}
- ignore: {name: "Use unless"}
- ignore: {name: "Use maybe"}
- ignore: {name: "Use fromMaybe"}
- ignore: {name: "Unused LANGUAGE pragma"}
